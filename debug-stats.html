<!DOCTYPE html>
<html>
<head>
    <title>Debug Statistiques CP2i</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .debug-box { background: #f5f5f5; padding: 15px; margin: 10px 0; border-radius: 5px; }
        .error { background: #ffebee; color: #c62828; }
        .success { background: #e8f5e8; color: #2e7d32; }
        table { border-collapse: collapse; width: 100%; margin: 10px 0; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background: #f5f5f5; }
    </style>
</head>
<body>
    <h1>🔍 Debug Statistiques CP2i</h1>
    
    <div class="debug-box">
        <h3>Test de connexion à l'API</h3>
        <button onclick="testAPI()">Tester l'API</button>
        <div id="api-result"></div>
    </div>
    
    <div class="debug-box">
        <h3>Données brutes de l'API</h3>
        <div id="raw-data"></div>
    </div>

    <script>
        async function testAPI() {
            const resultDiv = document.getElementById('api-result');
            const rawDataDiv = document.getElementById('raw-data');
            
            try {
                resultDiv.innerHTML = '<p>⏳ Test en cours...</p>';
                
                const response = await fetch('https://penccumndongo.com/src/app/back-end/debug-stats.php', {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                
                const data = await response.json();
                
                resultDiv.innerHTML = '<p class="success">✅ Connexion réussie!</p>';
                
                // Afficher les données brutes
                rawDataDiv.innerHTML = `
                    <h4>Réponse JSON complète:</h4>
                    <pre>${JSON.stringify(data, null, 2)}</pre>
                    
                    <h4>Statistiques extraites:</h4>
                    <table>
                        <tr><th>Métrique</th><th>Valeur</th></tr>
                        <tr><td>Total textes</td><td>${data.stats?.total_textes || 'N/A'}</td></tr>
                        <tr><td>Textes acceptés</td><td>${data.stats?.textes_acceptes || 'N/A'}</td></tr>
                        <tr><td>Textes refusés</td><td>${data.stats?.textes_refuses || 'N/A'}</td></tr>
                        <tr><td>Textes en attente</td><td>${data.stats?.textes_en_attente || 'N/A'}</td></tr>
                        <tr><td>Note moyenne</td><td>${data.stats?.note_moyenne || 'N/A'}</td></tr>
                    </table>
                `;
                
            } catch (error) {
                resultDiv.innerHTML = `<p class="error">❌ Erreur: ${error.message}</p>`;
                rawDataDiv.innerHTML = '';
            }
        }
        
        // Test automatique au chargement
        window.onload = () => testAPI();
    </script>
</body>
</html>
