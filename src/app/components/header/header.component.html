<header class="header">
  <div class="container">
    <img routerLink="/accueil" src="logo.png" alt="Penccum Ndongo Logo" class="logo">
    
    <!-- Icône hamburger visible sur mobile -->
    <button class="menu-toggle" [class.active]="menuOpen" (click)="toggleMenu()" aria-label="Ouvrir le menu">
      <span class="bar"></span>
      <span class="bar"></span>
      <span class="bar"></span>
    </button>

    <nav class="nav" [class.open]="menuOpen" (mouseleave)="closeMenuOnMouseLeave()">
      <!-- Correction : le menu complet doit être affiché par défaut -->
      <ng-container *ngIf="router.url.includes('apropos') 
                        || router.url.includes('devis') 
                        || router.url.includes('formations') 
                        || router.url.includes('formation-infographie') 
                        || router.url.includes('opportunites') 
                        || router.url.includes('cp2i')
                        || router.url.includes('services/'); else menuComplet">
        <a routerLink="/accueil" (click)="closeMenuOnClick()">{{ 'Accueil' }}</a>
        <a routerLink="/apropos" routerLinkActive="active" (click)="closeMenuOnClick()">{{ 'À Propos' }}</a>
      </ng-container>

      <ng-template #menuComplet>

          <a routerLink="/accueil" (click)="scrollToSection('accueil')" [class.active]="activeSection === 'accueil'">{{ 'Accueil' }}</a>
          <a routerLink="/apropos" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" (click)="closeMenuOnClick()">{{ 'À Propos' }}</a>
          <!-- Sous-menu Services -->
          <div class="dropdown services-dropdown"
            (mouseenter)="onServicesDropdownHover(true)"
            (mouseleave)="onServicesDropdownHover(false)">
            <button class="dropdown-btn services-btn" (click)="toggleServicesDropdownMobile($event)" [class.active]="activeSection === 'services'">
              Services <span class="arrow">&#9662;</span>
            </button>
            <div class="dropdown-content services-dropdown-content" [class.show]="showServicesDropdown">
              <a routerLink="/services/developpement-web" routerLinkActive="active" (click)="closeMenuOnClick()">Développement Web</a>
              <a routerLink="/services/design-graphique" routerLinkActive="active" (click)="closeMenuOnClick()">Design Graphique</a>
              <a routerLink="/services/community-management" routerLinkActive="active" (click)="closeMenuOnClick()">Community Management</a>
              <a routerLink="/services/marketing-digital" routerLinkActive="active" (click)="closeMenuOnClick()">Marketing Digital</a>
              <a routerLink="/services/formations-professionnelles" routerLinkActive="active" (click)="closeMenuOnClick()">Formations Pro</a>
            </div>
          </div>
          <!-- Sous-menu Projets réalisés -->
          <div class="dropdown portfolio-dropdown"
            (mouseenter)="onPortfolioDropdownHover(true)"
            (mouseleave)="onPortfolioDropdownHover(false)">
            <button class="dropdown-btn portfolio-btn" (click)="togglePortfolioDropdownMobile($event)" [class.active]="activeSection === 'portfolio'">
              Projets réalisés <span class="arrow">&#9662;</span>
            </button>
            <div class="dropdown-content portfolio-dropdown-content" [class.show]="showPortfolioDropdown">
              <a (click)="scrollToSection('web-projects'); closeMenuOnClick()">Sites Web</a>
              <a (click)="scrollToSection('graphic-projects'); closeMenuOnClick()">Conceptions Graphiques</a>
            </div>
          </div>
          <a (click)="scrollToSection('news') ; closeMenuOnClick()" [class.active]="activeSection === 'news'">{{ 'Actualités' }}</a>
          <a (click)="scrollToSection('contact') ; closeMenuOnClick()" [class.active]="activeSection === 'contact'">{{ 'Contact' }}</a>
        </ng-template>

      <!-- Onglet Offres avec menu déroulant -->
      <div class="dropdown"
        (mouseenter)="onDropdownHover(true)"
        (mouseleave)="onDropdownHover(false)">
        <button class="dropdown-btn" (click)="toggleDropdownMobile($event)">
          Offres <span class="arrow">&#9662;</span>
        </button>
        <div class="dropdown-content" [class.show]="showDropdown">
          <a routerLink="/opportunites" (click)="closeMenuOnClick()">Opportunités</a>
          <a routerLink="/formations" (click)="closeMenuOnClick()">Penc'Boost</a>
          <a routerLink="/formation-infographie" (click)="closeMenuOnClick()">Formation Infographie</a>
          <a routerLink="/cp2i" (click)="closeMenuOnClick()">CP2i</a>
          <a routerLink="/devis" class="devis-link" (click)="closeMenuOnClick()">Obtenir un Devis</a>
        </div>
      </div>
    </nav>
  </div>
</header>
