<div class="image-upload-container">
  <div class="upload-area" 
       [class.dragover]="isDragOver"
       (dragover)="onDragOver($event)"
       (dragleave)="onDragLeave($event)"
       (drop)="onDrop($event)"
       (click)="fileInput.click()">
    
    <input #fileInput 
           type="file" 
           accept="image/*" 
           multiple
           (change)="onFileSelect($event)"
           style="display: none;">
    
    <div class="upload-content" *ngIf="images.length === 0">
      <i class="fas fa-cloud-upload-alt"></i>
      <p>Cliquez ou glissez vos images ici</p>
      <small>JPG, PNG, GIF - Max 5MB par image</small>
    </div>
  </div>
  
  <div class="images-preview" *ngIf="images.length > 0">
    <div class="image-item" *ngFor="let image of images; let i = index">
      <img [src]="image.preview" [alt]="image.name">
      <div class="image-overlay">
        <span class="image-name">{{image.name}}</span>
        <button class="btn-remove" (click)="removeImage(i)">
          <i class="fas fa-times"></i>
        </button>
      </div>
    </div>
  </div>
  
  <div class="upload-info" *ngIf="images.length > 0">
    <span>{{images.length}} image(s) sélectionnée(s)</span>
    <button class="btn-clear" (click)="clearAll()">Tout supprimer</button>
  </div>
</div>
